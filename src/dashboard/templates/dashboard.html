<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyClaw 控制台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        bg: '#09090b',
        surface: { DEFAULT: '#18181b', 2: '#1f1f23', 3: '#27272a' },
        bdr: { DEFAULT: '#27272a', 2: '#3f3f46' },
        accent: { DEFAULT: '#818cf8', dim: '#6366f1', bg: 'rgba(129,140,248,.08)' },
        ok: { DEFAULT: '#34d399', bg: 'rgba(52,211,153,.1)' },
        warn: { DEFAULT: '#fbbf24', bg: 'rgba(251,191,36,.1)' },
        err: { DEFAULT: '#fb7185', bg: 'rgba(251,113,133,.1)' },
      },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','"Noto Sans SC"','Roboto','sans-serif'],
        mono: ['"Cascadia Code"','"Fira Code"','"SF Mono"', 'Consolas','monospace'],
      },
    },
  },
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#52525b}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .2s ease}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
  .pulse-dot{animation:pulse-dot 2s ease-in-out infinite}
</style>
</head>
<body class="bg-bg text-zinc-100 font-sans min-h-screen flex" x-data="app()" x-init="init()">

<!-- ── Sidebar ── -->
<aside class="w-[180px] shrink-0 bg-surface border-r border-bdr flex flex-col h-screen sticky top-0 z-40
              max-lg:hidden">
  <div class="h-14 flex items-center gap-3 px-4 border-b border-bdr">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-purple-500 flex items-center justify-center
                text-white font-extrabold text-sm shadow-lg shadow-accent/20">M</div>
    <span class="font-semibold text-sm tracking-tight">MyClaw</span>
  </div>
  <nav class="flex-1 py-2 px-2 space-y-0.5 overflow-y-auto">
    <template x-for="t in tabs" :key="t.id">
      <button @click="activeTab=t.id"
              :class="activeTab===t.id ? 'bg-accent/10 text-accent border-accent/30' : 'text-zinc-400 hover:text-zinc-200 hover:bg-surface-3 border-transparent'"
              class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] font-medium border transition-all duration-150">
        <span x-text="t.icon" class="text-base w-5 text-center"></span>
        <span x-text="t.label"></span>
      </button>
    </template>
  </nav>
  <div class="p-3 border-t border-bdr text-[10px] text-zinc-500 font-mono">
    <span x-text="modelProvider"></span>/<span x-text="modelName"></span>
  </div>
</aside>

<!-- ── Mobile bottom nav ── -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 bg-surface border-t border-bdr z-50 flex overflow-x-auto">
  <template x-for="t in tabs" :key="t.id">
    <button @click="activeTab=t.id"
            :class="activeTab===t.id ? 'text-accent' : 'text-zinc-500'"
            class="flex-1 min-w-[48px] flex flex-col items-center py-2 text-[10px]">
      <span x-text="t.icon" class="text-lg"></span>
      <span x-text="t.label" class="mt-0.5 truncate max-w-[60px]"></span>
    </button>
  </template>
</nav>

<!-- ── Main ── -->
<div class="flex-1 flex flex-col min-w-0">
  <!-- Top bar -->
  <header class="h-14 shrink-0 bg-surface/80 backdrop-blur border-b border-bdr flex items-center px-5 gap-4 sticky top-0 z-30">
    <h1 class="text-sm font-semibold lg:hidden">MyClaw</h1>
    <div class="flex-1"></div>
    <!-- Model switcher -->
    <div class="relative" x-data="{open:false}" @click.away="open=false">
      <button @click="open=!open"
              class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-3 border border-bdr text-xs font-mono text-accent hover:border-bdr-2 transition">
        <span x-text="modelProvider+'/'+modelName"></span>
        <svg class="w-3 h-3 text-zinc-500" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <div x-show="open" x-transition class="absolute right-0 mt-2 w-64 bg-surface-2 border border-bdr-2 rounded-xl shadow-2xl overflow-hidden z-50">
        <template x-for="m in models" :key="m.name">
          <button @click="switchModel(m); open=false"
                  :class="m.active ? 'bg-accent/10 text-accent' : 'text-zinc-300 hover:bg-surface-3'"
                  class="w-full flex items-center gap-3 px-4 py-2.5 text-xs border-b border-bdr last:border-0 transition">
            <span class="w-2 h-2 rounded-full" :class="m.active ? 'bg-accent' : 'bg-zinc-600'"></span>
            <span class="font-mono flex-1 text-left" x-text="m.name"></span>
            <span x-show="m.active" class="text-[10px] text-accent">当前</span>
          </button>
        </template>
        <div x-show="models.length===0" class="px-4 py-3 text-xs text-zinc-500">加载模型中...</div>
      </div>
    </div>
    <!-- Status -->
    <div class="flex items-center gap-2 text-xs text-zinc-400">
      <span class="w-2 h-2 rounded-full bg-ok pulse-dot shadow shadow-ok/50"></span>
      <span>运行中</span>
      <span class="text-zinc-600 font-mono" x-text="uptime"></span>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto p-5 lg:p-6 pb-20 lg:pb-6 max-w-[1400px] w-full mx-auto">

    <!-- ═══ Sessions ═══ -->
    <div x-show="activeTab==='sessions'" class="fade-up space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">会话</h2>
        <div class="flex items-center gap-2">
          <input x-model="sessionSearch" @input="filterSessions()"
                 placeholder="搜索会话..."
                 class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-200 placeholder-zinc-600 focus:border-accent outline-none w-48">
          <button @click="loadSessions()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 hover:border-bdr-2 transition">刷新</button>
        </div>
      </div>
      <div class="bg-surface border border-bdr rounded-xl overflow-hidden">
        <table class="w-full text-xs">
          <thead><tr class="bg-surface-2 text-zinc-500 uppercase text-[10px] tracking-wider">
            <th class="px-4 py-3 text-left">线程 ID</th>
            <th class="px-4 py-3 text-left">状态</th>
            <th class="px-4 py-3 text-left">空闲</th>
            <th class="px-4 py-3 text-left">消息数</th>
            <th class="px-4 py-3 text-right">操作</th>
          </tr></thead>
          <tbody>
            <template x-for="s in filteredSessions" :key="s.thread_id">
              <tr class="border-t border-bdr hover:bg-surface-2/50 transition">
                <td class="px-4 py-3 font-mono text-zinc-300 max-w-[280px] truncate" x-text="s.thread_id" :title="s.thread_id"></td>
                <td class="px-4 py-3">
                  <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-semibold"
                        :class="s.status==='active' ? 'bg-ok-bg text-ok' : 'bg-zinc-800 text-zinc-400'">
                    <span class="w-1.5 h-1.5 rounded-full" :class="s.status==='active' ? 'bg-ok' : 'bg-zinc-500'"></span>
                    <span x-text="s.status"></span>
                  </span>
                </td>
                <td class="px-4 py-3 text-zinc-400 font-mono" x-text="formatIdle(s.last_active)"></td>
                <td class="px-4 py-3 text-zinc-400 font-mono" x-text="s.checkpoint_count || '-'"></td>
                <td class="px-4 py-3 text-right">
                  <div class="flex items-center justify-end gap-1">
                    <button @click="viewMessages(s.thread_id)" class="px-2 py-1 rounded bg-surface-3 text-zinc-400 hover:text-accent hover:bg-accent/10 transition">消息</button>
                    <button @click="resetSession(s.thread_id)" class="px-2 py-1 rounded bg-surface-3 text-zinc-400 hover:text-err hover:bg-err/10 transition">重置</button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="filteredSessions.length===0">
              <td colspan="5" class="px-4 py-10 text-center text-zinc-600">没有找到会话</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ═══ Cron ═══ -->
    <div x-show="activeTab==='cron'" class="fade-up space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">定时任务</h2>
        <button @click="loadCron()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 hover:border-bdr-2 transition">刷新</button>
      </div>
      <template x-if="!cronEnabled">
        <div class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">定时任务已禁用</div>
      </template>
      <div class="grid gap-3" :class="cronJobs.length > 0 ? 'grid-cols-1 md:grid-cols-2' : ''">
        <template x-for="j in cronJobs" :key="j.name">
          <div class="bg-surface border border-bdr rounded-xl p-5 hover:border-bdr-2 transition">
            <div class="flex items-start justify-between mb-3">
              <div>
                <div class="font-semibold text-sm" x-text="j.name"></div>
                <div class="font-mono text-[11px] text-accent mt-1" x-text="j.schedule"></div>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold"
                    :class="j.enabled ? 'bg-ok-bg text-ok' : 'bg-zinc-800 text-zinc-500'"
                    x-text="j.enabled ? '已启用' : '已禁用'"></span>
            </div>
            <div class="text-xs text-zinc-400 space-y-1">
              <div x-show="j.message"><span class="text-zinc-500">消息：</span> <span x-text="(j.message||'').substring(0,120)"></span></div>
              <div x-show="j.last_run"><span class="text-zinc-500">上次运行：</span> <span x-text="formatTime(j.last_run)"></span></div>
              <div x-show="j.next_run"><span class="text-zinc-500">下次运行：</span> <span x-text="formatTime(j.next_run)"></span></div>
            </div>
            <div class="mt-3 flex gap-2">
              <button @click="runCronJob(j.name)" class="px-3 py-1 rounded-lg bg-accent/10 text-accent text-xs font-medium hover:bg-accent/20 transition">立即运行</button>
            </div>
          </div>
        </template>
      </div>
      <div x-show="cronEnabled && cronJobs.length===0" class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">没有配置定时任务</div>
    </div>

    <!-- ═══ MCP ═══ -->
    <div x-show="activeTab==='mcp'" class="fade-up space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">MCP 服务器</h2>
        <button @click="loadMcp()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 hover:border-bdr-2 transition">刷新</button>
      </div>
      <template x-if="!mcpEnabled">
        <div class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">MCP 已禁用</div>
      </template>
      <div class="grid gap-4 md:grid-cols-2">
        <template x-for="s in mcpServers" :key="s.name">
          <div class="bg-surface border border-bdr rounded-xl p-5 hover:border-bdr-2 transition">
            <div class="flex items-center justify-between mb-3">
              <span class="font-semibold text-sm" x-text="s.name"></span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold"
                    :class="s.status==='connected' ? 'bg-ok-bg text-ok' : 'bg-warn-bg text-warn'"
                    x-text="s.status || 'unknown'"></span>
            </div>
            <div x-show="s.command" class="text-xs font-mono text-zinc-500 mb-2 truncate" x-text="s.command"></div>
            <div x-show="s.tools && s.tools.length" class="mt-3 pt-3 border-t border-bdr space-y-1">
              <div class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">工具</div>
              <template x-for="t in (s.tools||[]).slice(0,10)" :key="t.name||t">
                <div class="text-xs font-mono text-accent/80" x-text="t.name || t"></div>
              </template>
              <div x-show="(s.tools||[]).length > 10" class="text-[11px] text-zinc-500">
                +<span x-text="(s.tools||[]).length - 10"></span> 更多
              </div>
            </div>
          </div>
        </template>
      </div>
      <div x-show="mcpEnabled && mcpServers.length===0" class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">没有配置 MCP 服务器</div>
    </div>

    <!-- ═══ Users ═══ -->
    <div x-show="activeTab==='users'" class="fade-up space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">用户管理</h2>
        <button @click="loadUsers()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 hover:border-bdr-2 transition">刷新</button>
      </div>
      <template x-if="!authEnabled">
        <div class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">认证已禁用</div>
      </template>
      <div x-show="authEnabled" class="bg-surface border border-bdr rounded-xl overflow-hidden">
        <table class="w-full text-xs">
          <thead><tr class="bg-surface-2 text-zinc-500 uppercase text-[10px] tracking-wider">
            <th class="px-4 py-3 text-left">用户 ID</th>
            <th class="px-4 py-3 text-left">角色</th>
            <th class="px-4 py-3 text-left">设备</th>
            <th class="px-4 py-3 text-right">操作</th>
          </tr></thead>
          <tbody>
            <template x-for="u in authUsers" :key="u.user_id">
              <tr class="border-t border-bdr hover:bg-surface-2/50 transition">
                <td class="px-4 py-3 font-mono text-zinc-300" x-text="u.user_id"></td>
                <td class="px-4 py-3">
                  <select :value="u.role" @change="updateRole(u.user_id, $event.target.value)"
                          class="bg-bg border border-bdr text-zinc-300 rounded px-2 py-0.5 text-[11px] outline-none focus:border-accent">
                    <option value="admin">admin</option>
                    <option value="user">user</option>
                    <option value="guest">guest</option>
                  </select>
                </td>
                <td class="px-4 py-3 text-zinc-400">
                  <span x-text="u.device_count || 0"></span> 设备，
                  <span x-text="u.trusted_devices || 0"></span> 已信任
                </td>
                <td class="px-4 py-3 text-right">
                  <button @click="deleteUser(u.user_id)" class="px-2 py-1 rounded bg-surface-3 text-zinc-400 hover:text-err hover:bg-err/10 transition">删除</button>
                </td>
              </tr>
            </template>
            <tr x-show="authUsers.length===0">
              <td colspan="4" class="px-4 py-10 text-center text-zinc-600">没有注册用户</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ═══ Audit ═══ -->
    <div x-show="activeTab==='audit'" class="fade-up space-y-4" x-init="loadAuditStats()">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">审计日志</h2>
        <div class="flex items-center gap-2">
          <select x-model="auditToolFilter" @change="loadAudit()" class="bg-surface border border-bdr text-zinc-300 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-accent">
            <option value="">全部工具</option>
            <template x-for="t in auditTopTools" :key="t.tool">
              <option :value="t.tool" x-text="t.tool+' ('+t.count+')'"></option>
            </template>
          </select>
          <select x-model="auditStatusFilter" @change="loadAudit()" class="bg-surface border border-bdr text-zinc-300 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-accent">
            <option value="">全部状态</option>
            <option value="success">成功</option>
            <option value="error">失败</option>
          </select>
          <button @click="loadAudit()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 transition">刷新</button>
        </div>
      </div>
      <!-- Stats bar -->
      <div class="flex items-center gap-3 text-xs flex-wrap">
        <span class="px-2.5 py-1 rounded-lg bg-accent/10 text-accent font-medium" x-text="(auditStats.total_calls||0)+' 次调用 (7天)'"></span>
        <span class="px-2.5 py-1 rounded-lg bg-ok-bg text-ok font-medium" x-text="(auditStats.success_count||0)+' 成功'"></span>
        <span class="px-2.5 py-1 rounded-lg bg-err/10 text-err font-medium" x-text="(auditStats.error_count||0)+' 失败'"></span>
        <span class="px-2.5 py-1 rounded-lg bg-warn-bg text-warn font-medium" x-text="Math.round((auditStats.success_rate||0)*100)+'%'"></span>
        <span class="px-2.5 py-1 rounded-lg bg-surface-3 text-zinc-400 font-mono" x-text="Math.round(auditStats.avg_duration_ms||0)+'ms 均耗'"></span>
      </div>
      <!-- Table -->
      <div class="bg-surface border border-bdr rounded-xl overflow-hidden">
        <table class="w-full text-xs">
          <thead><tr class="bg-surface-2 text-zinc-500 uppercase text-[10px] tracking-wider">
            <th class="px-4 py-3 text-left">时间</th>
            <th class="px-4 py-3 text-left">工具</th>
            <th class="px-4 py-3 text-left">发送者</th>
            <th class="px-4 py-3 text-left">状态</th>
            <th class="px-4 py-3 text-left">耗时</th>
            <th class="px-4 py-3 text-left">参数</th>
          </tr></thead>
          <tbody>
            <template x-for="e in auditEntries" :key="e.id">
              <tr class="border-t border-bdr hover:bg-surface-2/50 transition">
                <td class="px-4 py-2.5 text-zinc-500 whitespace-nowrap" x-text="formatTime(e.timestamp)"></td>
                <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded bg-accent/10 text-accent font-mono" x-text="e.tool_name"></span></td>
                <td class="px-4 py-2.5 text-zinc-400 font-mono" x-text="e.sender_id||'-'"></td>
                <td class="px-4 py-2.5">
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
                        :class="e.success ? 'bg-ok-bg text-ok' : 'bg-err/10 text-err'"
                        x-text="e.success ? '成功' : '失败'"></span>
                </td>
                <td class="px-4 py-2.5 text-zinc-400 font-mono" x-text="e.duration_ms>1000 ? (e.duration_ms/1000).toFixed(1)+'s' : Math.round(e.duration_ms)+'ms'"></td>
                <td class="px-4 py-2.5 text-zinc-500 max-w-[260px] truncate" x-text="e.args_preview||''" :title="e.args_preview||''"></td>
              </tr>
            </template>
            <tr x-show="auditEntries.length===0">
              <td colspan="6" class="px-4 py-10 text-center text-zinc-600">没有审计记录</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ═══ Logs ═══ -->
    <div x-show="activeTab==='logs'" class="fade-up space-y-3" x-init="startLogStream()">
      <div class="flex items-center gap-4 text-xs">
        <label class="flex items-center gap-2 text-zinc-400 cursor-pointer hover:text-zinc-200 transition">
          <input type="checkbox" x-model="logAutoScroll" class="accent-accent w-3.5 h-3.5"> 自动滚动
        </label>
        <label class="flex items-center gap-2 text-zinc-400 cursor-pointer hover:text-zinc-200 transition">
          <input type="checkbox" x-model="logShowAll" class="accent-accent w-3.5 h-3.5"> 全部日志器
        </label>
        <button @click="logLines=[]" class="px-2.5 py-1 rounded-lg bg-surface border border-bdr text-zinc-400 hover:text-zinc-200 transition">清空</button>
        <span class="flex-1"></span>
        <span class="text-zinc-600" x-text="logLines.length+' 行'"></span>
      </div>
      <div x-ref="logBox"
           class="bg-bg border border-bdr rounded-xl font-mono text-[11px] leading-[1.8] overflow-y-auto"
           style="height:calc(100vh - 200px)">
        <template x-for="(l,i) in logLines" :key="i">
          <div class="px-4 py-[1px] border-l-2 whitespace-pre-wrap break-all transition-colors hover:bg-white/[.02]"
               :class="{
                 'border-transparent text-zinc-400': l.level==='INFO' || l.level==='DEBUG',
                 'border-warn text-warn': l.level==='WARNING',
                 'border-err text-err bg-err/[.03]': l.level==='ERROR',
                 'border-white text-white bg-err': l.level==='CRITICAL',
               }">
            <span class="text-zinc-700 mr-2 select-none" x-text="formatLogTs(l.ts)"></span>
            <span class="text-accent/60 mr-2 select-none" x-text="l.logger?.replace('myclaw.','')"></span>
            <span x-text="l.message"></span>
          </div>
        </template>
        <div x-show="logLines.length===0" class="px-4 py-10 text-center text-zinc-600">等待日志...</div>
      </div>
    </div>

    <!-- ═══ Memory ═══ -->
    <div x-show="activeTab==='memory'" class="fade-up space-y-4" x-init="loadMemories()">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">记忆</h2>
        <button @click="showMemForm=!showMemForm" class="px-3 py-1.5 rounded-lg bg-accent/10 text-accent text-xs font-medium hover:bg-accent/20 transition"
                x-text="showMemForm ? '取消' : '+ 添加记忆'"></button>
      </div>
      <!-- Add form -->
      <div x-show="showMemForm" x-transition class="bg-surface border border-bdr rounded-xl p-5 space-y-3">
        <input x-model="memFormKey" placeholder="键名（可选）" class="w-full px-3 py-2 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 placeholder-zinc-600 focus:border-accent outline-none">
        <textarea x-model="memFormContent" placeholder="内容..." rows="3" class="w-full px-3 py-2 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 placeholder-zinc-600 focus:border-accent outline-none resize-y"></textarea>
        <div class="flex items-center gap-3">
          <button @click="saveMemory()" class="px-4 py-1.5 rounded-lg bg-accent/10 text-accent text-xs font-medium hover:bg-accent/20 transition">保存</button>
          <span x-show="memFormStatus" x-text="memFormStatus" class="text-xs" :class="memFormOk ? 'text-ok' : 'text-err'"></span>
        </div>
      </div>
      <!-- Search -->
      <input x-model="memSearch" @input="filterMemories()" placeholder="搜索记忆..."
             class="w-full px-3 py-2 rounded-lg bg-surface border border-bdr text-xs text-zinc-200 placeholder-zinc-600 focus:border-accent outline-none">
      <!-- Categories -->
      <template x-for="[cat, items] in Object.entries(filteredMemories)" :key="cat">
        <div class="space-y-1.5">
          <button @click="memOpen[cat]=!memOpen[cat]"
                  class="w-full flex items-center gap-3 px-4 py-2.5 bg-surface border border-bdr rounded-xl text-sm hover:bg-surface-2 transition">
            <span class="text-zinc-500 text-[10px] transition-transform" :class="memOpen[cat] ? 'rotate-90' : ''">&#9654;</span>
            <span class="font-medium" x-text="cat"></span>
            <span class="text-zinc-600 text-xs ml-auto" x-text="items.length+' 项'"></span>
          </button>
          <div x-show="memOpen[cat]" x-transition class="pl-5 space-y-1.5">
            <template x-for="m in items" :key="m.key">
              <div class="bg-surface border border-bdr rounded-xl px-4 py-3 hover:border-bdr-2 transition">
                <div class="font-mono text-[11px] text-accent mb-1.5" x-text="m.key"></div>
                <div class="text-xs text-zinc-300 leading-relaxed break-all" x-text="(m.content||'').substring(0,300)"></div>
                <div class="mt-2 flex gap-2">
                  <button @click="forgetMemory(m.key)" class="text-[11px] text-zinc-500 hover:text-err transition">删除</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
      <div x-show="Object.keys(filteredMemories).length===0" class="bg-surface border border-bdr rounded-xl p-10 text-center text-zinc-600">没有找到记忆</div>
    </div>

    <!-- ═══ Config ═══ -->
    <div x-show="activeTab==='config'" class="fade-up space-y-4" x-init="loadConfig()">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">配置</h2>
        <div class="flex items-center gap-2">
          <button @click="saveConfig()" class="px-3 py-1.5 rounded-lg bg-accent/10 text-accent text-xs font-medium hover:bg-accent/20 transition">保存</button>
          <button @click="loadConfig()" class="px-3 py-1.5 rounded-lg bg-surface border border-bdr text-xs text-zinc-400 hover:text-zinc-200 transition">重新加载</button>
          <span x-show="configStatus" x-text="configStatus" class="text-xs" :class="configOk ? 'text-ok' : 'text-err'"></span>
        </div>
      </div>
      <div class="grid gap-4 md:grid-cols-2">
        <template x-for="[section, values] in Object.entries(configData)" :key="section">
          <div class="bg-surface border border-bdr rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-bdr bg-surface-2 text-sm font-semibold capitalize" x-text="section"></div>
            <div class="p-4 space-y-3">
              <template x-for="[key, val] in Object.entries(values)" :key="key">
                <div>
                  <label class="block text-[11px] text-zinc-500 uppercase tracking-wider mb-1" x-text="key.replace(/_/g,' ')"></label>
                  <template x-if="typeof val === 'boolean'">
                    <input type="checkbox" :checked="val" @change="configData[section][key]=$event.target.checked"
                           class="accent-accent w-4 h-4">
                  </template>
                  <template x-if="typeof val === 'number'">
                    <input type="number" :value="val" @input="configData[section][key]=parseFloat($event.target.value)||0"
                           class="w-full px-3 py-1.5 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 outline-none focus:border-accent">
                  </template>
                  <template x-if="typeof val === 'string' && val.length <= 50">
                    <input type="text" :value="val" @input="configData[section][key]=$event.target.value"
                           class="w-full px-3 py-1.5 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 font-mono outline-none focus:border-accent">
                  </template>
                  <template x-if="typeof val === 'string' && val.length > 50">
                    <textarea :value="val" @input="configData[section][key]=$event.target.value" rows="2"
                              class="w-full px-3 py-1.5 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 font-mono outline-none focus:border-accent resize-y"></textarea>
                  </template>
                  <template x-if="Array.isArray(val) || (typeof val === 'object' && val !== null)">
                    <div class="px-3 py-1.5 rounded-lg bg-bg border border-bdr text-xs text-zinc-400 font-mono max-h-24 overflow-auto"
                         x-text="JSON.stringify(val, null, 2)"></div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ═══ Analytics ═══ -->
    <div x-show="activeTab==='analytics'" class="fade-up space-y-4" x-init="loadAnalytics()">
      <h2 class="text-lg font-semibold">统计分析</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-surface border border-bdr rounded-xl p-4">
          <div class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">总调用次数 (7天)</div>
          <div class="text-2xl font-bold text-accent" x-text="analyticsStats.total_calls||0"></div>
        </div>
        <div class="bg-surface border border-bdr rounded-xl p-4">
          <div class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">平均耗时</div>
          <div class="text-2xl font-bold text-ok" x-text="Math.round(analyticsStats.avg_duration_ms||0)+'ms'"></div>
        </div>
        <div class="bg-surface border border-bdr rounded-xl p-4">
          <div class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">成功率</div>
          <div class="text-2xl font-bold text-ok" x-text="Math.round((analyticsStats.success_rate||0)*100)+'%'"></div>
        </div>
        <div class="bg-surface border border-bdr rounded-xl p-4">
          <div class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">错误数</div>
          <div class="text-2xl font-bold" :class="(analyticsStats.error_count||0)>0 ? 'text-err' : 'text-zinc-500'" x-text="analyticsStats.error_count||0"></div>
        </div>
      </div>
      <!-- Top tools -->
      <div class="bg-surface border border-bdr rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-bdr bg-surface-2 text-sm font-semibold">工具使用排行</div>
        <table class="w-full text-xs">
          <thead><tr class="text-zinc-500 uppercase text-[10px] tracking-wider">
            <th class="px-4 py-2.5 text-left">工具</th>
            <th class="px-4 py-2.5 text-left">调用次数</th>
            <th class="px-4 py-2.5 text-left">成功率</th>
            <th class="px-4 py-2.5 text-left">平均耗时</th>
          </tr></thead>
          <tbody>
            <template x-for="t in analyticsStats.top_tools||[]" :key="t.tool">
              <tr class="border-t border-bdr hover:bg-surface-2/50 transition">
                <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded bg-accent/10 text-accent font-mono" x-text="t.tool"></span></td>
                <td class="px-4 py-2.5 text-zinc-300" x-text="t.count"></td>
                <td class="px-4 py-2.5 text-ok font-mono" x-text="Math.round((t.success_rate||0)*100)+'%'"></td>
                <td class="px-4 py-2.5 text-zinc-400 font-mono" x-text="Math.round(t.avg_duration_ms||0)+'ms'"></td>
              </tr>
            </template>
            <tr x-show="(analyticsStats.top_tools||[]).length===0">
              <td colspan="4" class="px-4 py-10 text-center text-zinc-600">暂无工具使用数据</td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- Recent errors -->
      <div class="bg-surface border border-bdr rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-bdr bg-surface-2 text-sm font-semibold">最近错误</div>
        <div class="p-4">
          <template x-for="e in analyticsErrors" :key="e.id">
            <div class="flex items-start gap-3 py-2 border-b border-bdr last:border-0">
              <span class="px-2 py-0.5 rounded bg-err/10 text-err font-mono text-[11px]" x-text="e.tool_name"></span>
              <div class="flex-1 text-xs text-zinc-400 font-mono break-all" x-text="e.error||'未知错误'"></div>
              <span class="text-zinc-600 text-[10px] whitespace-nowrap" x-text="formatTime(e.timestamp)"></span>
            </div>
          </template>
          <div x-show="analyticsErrors.length===0" class="text-center text-zinc-600 py-4">没有最近的错误</div>
        </div>
      </div>
    </div>

    <!-- ═══ Message Modal ═══ -->
    <template x-if="msgModal">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70" @click.self="msgModal=null">
        <div class="bg-surface border border-bdr rounded-2xl w-[95%] max-w-[850px] max-h-[85vh] flex flex-col shadow-2xl">
          <div class="flex items-center justify-between px-5 py-4 border-b border-bdr">
            <div>
              <div class="text-sm font-semibold">会话消息</div>
              <div class="text-[11px] text-zinc-500 font-mono mt-0.5" x-text="msgModal.threadId"></div>
            </div>
            <div class="flex items-center gap-3">
              <input x-model="msgSearch" placeholder="搜索..." class="px-2.5 py-1 rounded-lg bg-bg border border-bdr text-xs text-zinc-200 placeholder-zinc-600 outline-none focus:border-accent w-44">
              <button @click="msgModal=null" class="text-zinc-400 hover:text-zinc-200 text-xl transition">&times;</button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto p-5 space-y-3">
            <template x-for="(m,i) in msgModal.messages.filter(x=>!msgSearch || (x.content||'').toLowerCase().includes(msgSearch.toLowerCase()))" :key="i">
              <div class="flex" :class="m.role==='user' ? 'justify-end' : 'justify-start'">
                <div class="max-w-[80%] rounded-2xl px-4 py-3 border"
                     :class="m.role==='user' ? 'bg-accent/10 border-accent/20' : m.role==='tool' ? 'bg-surface-3 border-bdr' : 'bg-surface-2 border-bdr'">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] font-semibold uppercase"
                          :class="m.role==='user' ? 'text-ok' : m.role==='assistant' ? 'text-accent' : 'text-zinc-500'"
                          x-text="m.role"></span>
                    <span x-show="m.tool_name" class="px-1.5 py-0.5 rounded bg-accent/10 text-accent text-[10px] font-mono" x-text="m.tool_name"></span>
                  </div>
                  <div class="text-xs text-zinc-300 whitespace-pre-wrap break-all leading-relaxed"
                       x-text="m.content && m.content.length > 500 ? m.content.substring(0,500)+'...' : m.content"></div>
                </div>
              </div>
            </template>
          </div>
          <div class="px-5 py-3 border-t border-bdr flex items-center justify-between text-xs text-zinc-500">
            <span x-text="msgModal.messages.length+' 条消息'"></span>
            <button x-show="msgModal.hasMore" @click="loadMoreMessages()" class="px-3 py-1 rounded-lg bg-surface-3 text-zinc-400 hover:text-zinc-200 transition">加载更多</button>
          </div>
        </div>
      </div>
    </template>

  </main>
</div>

<script>
const AUTH_TOKEN = "{{ auth_token }}";

function app() {
  return {
    tabs: [
      {id:'sessions', icon:'\u25A1', label:'\u4F1A\u8BDD'},
      {id:'cron', icon:'\u23F0', label:'\u5B9A\u65F6\u4EFB\u52A1'},
      {id:'mcp', icon:'\uD83D\uDD27', label:'MCP'},
      {id:'users', icon:'\uD83D\uDC64', label:'\u7528\u6237'},
      {id:'audit', icon:'\uD83D\uDCDC', label:'\u5BA1\u8BA1'},
      {id:'logs', icon:'\uD83D\uDCCB', label:'\u65E5\u5FD7'},
      {id:'memory', icon:'\uD83D\uDCA0', label:'\u8BB0\u5FC6'},
      {id:'config', icon:'\u2699\uFE0F', label:'\u914D\u7F6E'},
      {id:'analytics', icon:'\uD83D\uDCC8', label:'\u7EDF\u8BA1'},
    ],
    activeTab: 'sessions',
    modelProvider: "{{ model_provider }}",
    modelName: "{{ model_name }}",
    models: [],
    uptime: '',
    _startTs: Date.now(),

    sessions: [],
    filteredSessions: [],
    sessionSearch: '',

    cronEnabled: false,
    cronJobs: [],

    mcpEnabled: false,
    mcpServers: [],

    authEnabled: false,
    authUsers: [],

    auditToolFilter: '',
    auditStatusFilter: '',
    auditEntries: [],
    auditStats: {},
    auditTopTools: [],

    logLines: [],
    logAutoScroll: true,
    logShowAll: false,
    _logEs: null,

    memories: {},
    filteredMemories: {},
    memSearch: '',
    memOpen: {},
    showMemForm: false,
    memFormKey: '',
    memFormContent: '',
    memFormStatus: '',
    memFormOk: false,

    configData: {},
    configStatus: '',
    configOk: false,

    analyticsStats: {},
    analyticsErrors: [],

    msgModal: null,
    msgSearch: '',

    async init() {
      this._uptimeTick();
      setInterval(() => this._uptimeTick(), 1000);
      await Promise.all([
        this.loadModels(),
        this.loadSessions(),
        this.loadCron(),
        this.loadMcp(),
        this.loadUsers(),
      ]);
    },

    _uptimeTick() {
      const sec = Math.floor((Date.now() - this._startTs) / 1000);
      const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      this.uptime = h+'h '+m+'m '+s+'s';
    },

    async api(path, opts={}) {
      const headers = opts.headers || {};
      if (AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
      const r = await fetch(path, {...opts, headers});
      return r.json();
    },

    async apiPost(path, body) {
      return this.api(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
    },

    async apiDelete(path) {
      return this.api(path, {method: 'DELETE'});
    },

    async apiPatch(path, body) {
      return this.api(path, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
    },

    formatIdle(ts) {
      if (!ts) return '-';
      const sec = Math.max(0, Math.floor((Date.now()/1000) - ts));
      if (sec < 60) return sec+'s';
      if (sec < 3600) return Math.floor(sec/60)+'m '+Math.round(sec%60)+'s';
      return Math.floor(sec/3600)+'h '+Math.floor((sec%3600)/60)+'m';
    },

    formatTime(ts) {
      if (!ts) return '-';
      const d = new Date(typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : ts);
      return d.toLocaleString();
    },

    formatLogTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('zh-CN', {hour12:false});
    },

    // ── Models ──
    async loadModels() {
      const d = await this.api('/api/dashboard/models');
      if (d.available) {
        this.models = d.available;
        if (d.current) {
          this.modelProvider = d.current.provider || this.modelProvider;
          this.modelName = d.current.name || this.modelName;
        }
      }
    },

    async switchModel(m) {
      const d = await this.apiPost('/api/dashboard/models/switch', {provider: m.provider||'', name: m.name});
      if (d.ok) {
        this.modelName = m.name;
        await this.loadModels();
      }
    },

    // ── Sessions ──
    async loadSessions() {
      const d = await this.api('/api/dashboard/sessions');
      this.sessions = Array.isArray(d) ? d : [];
      this.filterSessions();
    },

    filterSessions() {
      const q = this.sessionSearch.toLowerCase();
      this.filteredSessions = q
        ? this.sessions.filter(s => s.thread_id.toLowerCase().includes(q))
        : this.sessions;
    },

    async resetSession(tid) {
      if (!confirm('确认重置会话 '+tid+'？')) return;
      await this.apiPost('/api/dashboard/sessions/'+encodeURIComponent(tid)+'/reset', {});
      await this.loadSessions();
    },

    async viewMessages(tid) {
      const d = await this.api('/api/dashboard/sessions/'+encodeURIComponent(tid)+'/messages?limit=50');
      this.msgModal = {
        threadId: tid,
        messages: d.messages || [],
        total: d.total || 0,
        hasMore: d.has_more || false,
        _offset: 50,
      };
      this.msgSearch = '';
    },

    async loadMoreMessages() {
      if (!this.msgModal) return;
      const d = await this.api('/api/dashboard/sessions/'+encodeURIComponent(this.msgModal.threadId)+'/messages?limit=50&offset='+this.msgModal._offset);
      this.msgModal.messages = this.msgModal.messages.concat(d.messages || []);
      this.msgModal.hasMore = d.has_more || false;
      this.msgModal._offset += 50;
    },

    // ── Cron ──
    async loadCron() {
      const d = await this.api('/api/dashboard/cron');
      this.cronEnabled = d.enabled || false;
      this.cronJobs = d.jobs || [];
    },

    async runCronJob(name) {
      await this.apiPost('/api/cron/jobs/'+encodeURIComponent(name)+'/run', {});
      await this.loadCron();
    },

    // ── MCP ──
    async loadMcp() {
      const d = await this.api('/api/dashboard/mcp');
      this.mcpEnabled = d.enabled || false;
      this.mcpServers = d.servers || [];
    },

    // ── Users ──
    async loadUsers() {
      const d = await this.api('/api/dashboard/users');
      this.authEnabled = d.enabled || false;
      this.authUsers = d.users || [];
    },

    async updateRole(uid, role) {
      await this.apiPatch('/api/dashboard/users/'+encodeURIComponent(uid)+'/role', {role});
      await this.loadUsers();
    },

    async deleteUser(uid) {
      if (!confirm('确认删除用户 '+uid+'？')) return;
      await this.apiDelete('/api/dashboard/users/'+encodeURIComponent(uid));
      await this.loadUsers();
    },

    // ── Audit ──
    async loadAuditStats() {
      const d = await this.api('/api/dashboard/audit/stats?days=7');
      this.auditStats = d.error ? {} : d;
      this.auditTopTools = d.top_tools || [];
      await this.loadAudit();
    },

    async loadAudit() {
      let url = '/api/dashboard/audit?limit=100';
      if (this.auditToolFilter) url += '&tool_name='+encodeURIComponent(this.auditToolFilter);
      if (this.auditStatusFilter) url += '&status='+encodeURIComponent(this.auditStatusFilter);
      const d = await this.api(url);
      this.auditEntries = d.entries || [];
    },

    // ── Logs ──
    startLogStream() {
      if (this._logEs) return;
      const url = AUTH_TOKEN ? '/api/dashboard/stream?token='+AUTH_TOKEN : '/api/dashboard/stream';
      this._logEs = new EventSource(url);
      this._logEs.addEventListener('log', (e) => {
        try {
          const entry = JSON.parse(e.data);
          this.logLines.push(entry);
          if (this.logLines.length > 2000) this.logLines.splice(0, this.logLines.length - 2000);
          if (this.logAutoScroll) {
            this.$nextTick(() => {
              const box = this.$refs.logBox;
              if (box) box.scrollTop = box.scrollHeight;
            });
          }
        } catch(ex) {}
      });
      this._logEs.onerror = () => {};
    },

    // ── Memory ──
    async loadMemories() {
      const d = await this.api('/api/dashboard/memory/memories');
      if (d.error) { this.memories = {}; this.filteredMemories = {}; return; }
      this.memories = d;
      this.filterMemories();
    },

    filterMemories() {
      const q = this.memSearch.toLowerCase();
      const result = {};
      for (const [cat, items] of Object.entries(this.memories)) {
        if (!Array.isArray(items)) continue;
        const filtered = q ? items.filter(m => (m.key||'').toLowerCase().includes(q) || (m.content||'').toLowerCase().includes(q)) : items;
        if (filtered.length) result[cat] = filtered;
      }
      this.filteredMemories = result;
    },

    async saveMemory() {
      if (!this.memFormContent.trim()) return;
      this.memFormStatus = '保存中...';
      const d = await this.apiPost('/api/dashboard/memory/remember', {content: this.memFormContent, key: this.memFormKey});
      this.memFormOk = d.ok;
      this.memFormStatus = d.ok ? '已保存' : (d.error || '保存失败');
      if (d.ok) {
        this.memFormContent = '';
        this.memFormKey = '';
        this.showMemForm = false;
        await this.loadMemories();
      }
      setTimeout(() => this.memFormStatus = '', 3000);
    },

    async forgetMemory(key) {
      if (!confirm('确认删除 "'+key+'"？')) return;
      await this.apiDelete('/api/dashboard/memory/forget/'+encodeURIComponent(key));
      await this.loadMemories();
    },

    // ── Config ──
    async loadConfig() {
      this.configData = await this.api('/api/dashboard/config');
    },

    async saveConfig() {
      this.configStatus = '保存中...';
      const d = await this.apiPost('/api/dashboard/config/update', this.configData);
      this.configOk = d.ok;
      this.configStatus = d.ok ? '已保存' : (d.error || '保存失败');
      setTimeout(() => this.configStatus = '', 3000);
    },

    // ── Analytics ──
    async loadAnalytics() {
      const stats = await this.api('/api/dashboard/audit/stats?days=7');
      this.analyticsStats = stats.error ? {} : stats;
      const errs = await this.api('/api/dashboard/audit?limit=10&status=error');
      this.analyticsErrors = errs.entries || [];
    },
  };
}
</script>
</body>
</html>

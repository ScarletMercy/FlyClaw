[project]
name = "flyclaw"
version = "2026.6.18.1"
description = "轻量级多渠道 AI 助手框架，40+ 内置工具，支持 QQ/微信接入"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "watchfiles>=1.0",
    "tavily-python>=0.5",
    "websockets>=13.0",
    "markdownify>=0.14",
    "cryptography>=42.0",
    "aiohttp>=3.9,<4",
    "qrcode>=7.0,<8",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'win32'",
    "edge-tts>=6.0",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
memory = ["sqlite-vec>=0.1.6"]
memory-lancedb = ["lancedb>=0.6", "pyarrow"]
termux = [
    "flyclaw[memory]",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "pytest-timeout>=2.3", "ruff>=0.8", "httpx>=0.28", "types-PyYAML>=6.0"]

[tool.ruff]
target-version = "py311"
line-length = 120

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.dashboard" = ["templates/**/*"]

[tool.uv.sources]

[project.scripts]
flyclaw = "src.cli:cli_main"
flyclaw-setup = "src.setup:main"
flyclaw-daemon = "src.daemon:main_daemon"
flyclaw-acp = "src.acp.cli:main"

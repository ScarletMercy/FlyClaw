[project]
name = "myclaw"
version = "0.1.0"
description = "Self-contained AI assistant with QQ channel"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "watchfiles>=1.0",
    "tavily-python>=0.5",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "markdownify>=0.14",
]

[project.optional-dependencies]
imaging = ["Pillow>=10.0"]
memory = ["sqlite-vec>=0.1.6"]
memory-lancedb = ["lancedb>=0.6", "pyarrow"]
tts = ["edge-tts>=6.0"]
termux = [
    "myclaw[memory]",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]

[project.scripts]
myclaw = "src.cli:cli_main"
myclaw-setup = "src.setup:main"
myclaw-daemon = "src.daemon:main_daemon"
myclaw-acp = "src.acp.cli:main"
